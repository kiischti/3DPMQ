services:
  3dpmq:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD in .env}
      TZ: Europe/Luxembourg
      # SESSION_SECRET: optional; generated and stored in the database if unset
      # POLL_MS: 5000
      # RETENTION_DAYS: 30
    volumes:
      - 3dpmq-data:/data
volumes:
  3dpmq-data:
